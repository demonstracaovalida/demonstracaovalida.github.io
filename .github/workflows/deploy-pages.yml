name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Usar npm declarado pelo projeto no novo site
        if: github.repository == 'demonstracaovalida/demonstracaovalida.github.io'
        run: npm install --global npm@12.0.2
      - name: Instalar dependências
        run: npm ci
      - name: Compilar para o caminho do Pages original
        if: github.repository != 'demonstracaovalida/demonstracaovalida.github.io'
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"
      - name: Compilar para a raiz do novo Pages
        if: github.repository == 'demonstracaovalida/demonstracaovalida.github.io'
        run: npm run build -- --base-href /
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demonstracaoValida/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
