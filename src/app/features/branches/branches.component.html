<section class="branches-panel" aria-labelledby="branches-heading">
  <h1 id="branches-heading">Filiais</h1>

  <div class="branches-table-scroll" role="region" aria-label="Lista de filiais" tabindex="0" data-tour="branches-list">
  <table class="branches-table" aria-label="Empresas e filiais da demonstração">
    <colgroup>
      <col class="cnpj-column" />
      <col class="legal-name-column" />
      <col class="trade-name-column" />
    </colgroup>
    <thead>
      <tr>
        <th scope="col">Cnpj</th>
        <th scope="col">Razao</th>
        <th scope="col">Fantasia</th>
      </tr>
    </thead>
    <tbody>
      @for (company of companies(); track company.id) {
        <tr [class.current-company]="company.isCurrentCompany" [attr.data-tour]="company.isCurrentCompany ? 'branches-current' : null">
          <td class="cnpj-cell">{{ company.cnpj }}</td>
          <td>{{ company.legalName }}</td>
          <td>{{ company.tradeName }}</td>
        </tr>
      }
    </tbody>
  </table>
  </div>
</section>
