<header class="top-navbar">
  <a class="brand-mark" routerLink="/" aria-label="Valida — Início">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M2.5 14.5 8 20l11-13" />
      <path d="m12 18 5 5L30 7" />
    </svg>
  </a>

  <nav class="primary-navigation" aria-label="Navegação principal">
    <a class="navigation-item" routerLink="/">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 7.2 8 1l7 6.2v7.3h-5V9.8H6v4.7H1z" /></svg>
      <span>Início</span>
    </a>

    <div class="navigation-dropdown" data-tour="nav-conciliation">
      <button class="navigation-item" type="button" aria-haspopup="true" aria-label="Conciliação, abrir submenu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h12v3H2zm0 5h12v2H2zm0 4h8v3H2z" /></svg>
        <span>Conciliação</span><i class="caret" aria-hidden="true"></i>
      </button>
      <div class="navigation-submenu">
        <a routerLink="/nova-conciliacao" data-tour-action="nav-manual">Nova Conciliação</a>
      </div>
    </div>

    <span class="navigation-item">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 15 14H1zm0 4v4m0 2v1" /></svg>
      <span>Ocorrências</span>
    </span>

    <a class="navigation-item" routerLink="/filiais" data-tour="nav-branches" data-tour-action="nav-branches">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V2h12v12M0 14h16M5 5h2m2 0h2M5 8h2m2 0h2M6 14v-3h4v3" /></svg>
      <span>Filiais</span>
    </a>

    <span class="navigation-item">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1 1.4 1.7 2.2-.3.5 2.2 2 1-.8 2 1 2-1.8 1.2-.2 2.2-2.2.2L8 15l-1.8-1.4-2.2.2-.4-2.2-1.9-1 .7-2-1-2 1.8-1.2.2-2.2 2.2-.2zM8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" /></svg>
      <span>MeuValida</span><i class="caret" aria-hidden="true"></i>
    </span>

    @if (showTutorialButton()) {
      <button class="navigation-item tutorial-start" type="button" (click)="startTutorial()">Iniciar tutorial</button>
    }
  </nav>

  <div class="company-indicator" aria-label="Empresa atual: CONCILIADOR DEMONSTRAÇÃO">
    <span>10723113000179</span>
    <small>CONCILIADOR DEMONSTRAÇÃO</small>
  </div>

  <span class="notification" tabindex="0" aria-label="Notificações: 1" aria-describedby="visitor-greeting">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a5 5 0 0 0-5 5v3.2L3.2 13v1h13.6v-1L15 10.2V7a5 5 0 0 0-5-5Zm-2 14a2 2 0 0 0 4 0Z" /></svg>
    <b>1</b>
    <span id="visitor-greeting" class="notification-message" role="tooltip">Bem-vindo à prévia do Valida!</span>
  </span>
</header>
